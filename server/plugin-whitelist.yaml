# ============================================================
# 插件代理白名单（独立文件，便于修改）
# ------------------------------------------------------------
# 结构：pluginId → [origin, ...]
#
# 约束（服务端强制）：
#   · 只允许 https（不接受 http，避免降级）
#   · 只允许 origin（不能带路径 / query / fragment）
#   · 不允许带认证信息（user:pass@）
#   · 不支持通配符（*.example.com 会被跳过）
#   · 每个插件最多 10 条；重复自动去重
#
# 热重载：
#   · 后端每 30 秒或文件 mtime 变化时自动重读（见 services/pluginWhitelist.js）
#   · 修改后**无需重启**，下一次代理请求即生效
#   · YAML 写坏时：**保留上一次的有效配置** + 打印警告
#
# 例子：
#   ai-chat:
#     - https://backend.miaoda.online
#   weather:
#     - https://api.openweathermap.org
#   my-plugin:
#     - https://api.example.com
#     - https://cdn.example.com
# ============================================================

# 当前生效的白名单（下面是真实配置，不是示例）
ai-chat:
  - https://backend.miaoda.online

# ============================================================
# 使用说明
# ------------------------------------------------------------
# 1. 添加新插件白名单：
#      在下面追加 pluginId: [origin...]，保存即可。
#      后端下一次收到该插件的代理请求时会自动读到。
#
# 2. 修改 / 删除：
#      直接改或删对应行，保存即生效。
#
# 3. 临时清空某个插件的白名单（= 禁止代理）：
#      把该插件名下所有 origin 删掉，或整段注释掉。
#
# 4. 校验白名单是否已被读到：
#      GET /api/admin/plugins/whitelist    （管理员）
#      返回 { whitelist: { pluginId: [origin...] }, updatedAt, source }
# ============================================================