# 用户守则

**版本**：1.0
**生效日期**：2026-10-02
**适用范围**：本应用（以下称"本服务"）的全部功能，包括聊天、好友、群聊、商城、积分、转账、红包、表情包、插件、API 密钥等。

---

## 一、总则

### 1.1 使用本服务即表示你同意本守则

注册账号、登录、使用任何功能，均视为你已阅读、理解并同意本守则的全部条款。

### 1.2 你必须是具备完全民事行为能力的人

未满 14 周岁的用户不得使用本服务。14 至 18 周岁用户须在监护人指导下使用。

### 1.3 本守则可能更新

我们可能根据运营情况调整本守则，重大变更将通过站内通知或公告告知。继续使用即视为同意更新后的守则。

## 二、账号与安全

### 2.1 一人一号

- 请勿批量注册账号（"小号"）用于刷分、刷榜、绕开封禁或其他违规目的
- 每人最多持有合理数量的账号；批量注册可能被系统识别并自动限制

### 2.2 保管好你的账号

- 密码、登录凭据、API 密钥由你本人负责保管
- **不要**把密码、密钥发给任何人（包括自称"管理员"的人 —— 官方永远不会向你索要密码）
- 账号下发生的一切行为由账号持有人负责

### 2.3 异常情况

- 发现账号被盗用 → 立即修改密码 → 通过管理员联系
- 账号被误封 → 参见第十一章"申诉"

## 三、行为规范

### 3.1 禁止骚扰与冒犯

在公共聊天、私聊、群聊中，一律禁止：

- 人身攻击、辱骂、歧视性言论（地域、性别、种族、宗教、性取向等）
- 恶意刷屏、连续发送无意义内容、频繁 @ 他人
- 未经同意公开他人隐私信息（真实姓名、住址、电话、照片等）
- 冒充他人身份、冒充官方账户（`__official__` / 管理员 / 开发者）
- 传播谣言、虚假信息

### 3.2 禁止违法内容

严禁发布、传播、讨论：

- 涉及色情、暴力、恐怖主义的内容
- 涉及赌博、毒品、武器交易的内容
- 侵犯他人著作权、商标权、专利权的内容
- 涉及诈骗、传销、非法集资的内容
- 其他违反中华人民共和国法律法规的内容

### 3.3 尊重他人

- 拒绝不想收到的私聊 → 用"删除好友"功能
- 进群前了解群规，遵守群主的管理
- 群内发消息注意上下文，避免打断他人

## 四、内容规范

### 4.1 文字消息

- 单条文字上限 2000 字符
- 引用消息、@ 提及请谨慎，不要用于骚扰
- 撤回窗口为 2 分钟，超时无法撤回

### 4.2 图片、视频、音频、文件

- 上传前请确认你**有权分享**该内容
- 禁止上传恶意文件（病毒、木马、脚本木马等）
- 禁止上传含色情、暴力内容的图片 / 视频
- 系统会自动压缩部分图片（头像、封面、背景）以优化体验；聊天附件与商品内容文件**不压缩**

### 4.3 表情包

- 表情包图片同样受本守则约束
- **不得上传**含违法、色情、暴力、辱骂内容的表情
- 分享表情包时，请确认你对图片拥有发布权
- 从商城购买的表情包仅供你本人使用；转发、转售、二次分发可能违反原作者的授权

### 4.4 文件类型限制

- **服务端不收**：HEIC / HEIF / TIFF（桌面浏览器无法渲染）
- **禁止上传**：HTML / SVG / XML / JS / CSS / MJS / CJS（防止 XSS）

## 五、商城与交易

### 5.1 市场分类与规则

| 市场 | 谁能上架 | 定价方式 | 审核 |
| --- | --- | --- | --- |
| 官方市场（official） | 管理员及以上 | 官方定价 | 无（直接上架） |
| 标准市场（standard） | 所有登录用户 | 提交后由开发者评估 | 有 |
| 跳蚤市场（flea） | 所有登录用户 | 自己定价 | 无 |

### 5.2 上架要求

- 标题 2-80 字符，描述最多 2000 字符
- 至少 1 个文件，最多 20 个
- 价格范围 0-100000 积分（0 = 免费）
- 外观素材类（背景 / 气泡 / 表情包）**至少包含一张图片文件**

### 5.3 抄袭检测

- 系统对商品做 **sha256 素材比对 + simhash 文本相似度** 双重检测
- 与已有商品（同分类，非你本人发布）**完全一致或高度相似**的，**自动下架**为 `pirated`
- 误判可联系管理员申诉；请保留创作过程证据（源文件、时间戳等）

### 5.4 禁止事项

- 不得盗用他人作品上架（包括但不限于图片、字体、代码、音视频）
- 不得上架恶意软件、木马、病毒
- 不得刷单、刷评、虚假交易
- 不得冒用官方或他人名义发布商品
- 不得利用系统漏洞获取不当利益

### 5.5 购买须知

- 购买前请仔细阅读商品描述与文件列表
- 数字商品一旦交付，通常**不支持退款**（除非商品有质量问题或未按描述交付）
- 外观素材类商品**可被多人购买**，你购买的是**授权使用**，不是**独占所有权**
- 普通商品在售出后即变为 `sold`，不再对其他买家开放

### 5.6 商品交付

- 商品文件放在 `uploads/shop/`，**必须通过鉴权接口下载**，不能直接通过 URL 访问
- 你购买后，文件会出现在「我购买的」列表中，随时可下载
- 表情包商品购买后整包加入你的个人表情库，**不提供单张文件下载**

## 六、积分与支付

### 6.1 积分来源

- **注册赠送**：50 积分（每人一次性）
- **出售商品**：获得买家支付的全部积分
- **管理员发放**：违规处罚或活动奖励
- **退款**：其他来源的积分退回

### 6.2 积分用途

- 购买商品
- 转账给其他用户
- 发红包
- 支付插件费用

### 6.3 转账

- 转账金额范围：1-10000 积分
- 每日发出额度上限：50000 积分（转账 + 红包合计）
- 有效期 24 小时：对方未收款自动退回
- 对方可主动退还

### 6.4 红包

- 单个红包总额 1-10000 积分
- 最多 100 份
- 有效期 24 小时：未领完的部分自动退回发送者
- 私聊红包只能 1 份（一对一）
- 发送者不能抢自己发的红包

### 6.5 禁止事项

- 不得刷分（利用漏洞、反复注册、批量交易等）
- 不得利用转账 / 红包从事洗钱、赌博、诈骗等
- 不得对陌生人大额转账（诈骗往往从"小恩小惠"开始）
- 不得伪造交易记录、篡改流水

### 6.6 资金托管

- 转账 / 红包的积分在成交前由**官方账户临时托管**
- 收款 / 领红包时，托管积分划给收款方
- 过期 / 拒绝时，托管积分退回发送方

## 七、上传与文件

### 7.1 上传限制

| 类型 | 单文件上限 | 备注 |
| --- | --- | --- |
| 头像 | 8 MB | 支持 PNG / JPG / GIF / WebP / BMP / AVIF |
| 聊天附件 | 500 MB | 不限类型（危险扩展名除外） |
| 商品文件 | 500 MB | 交付物，原样保留 |
| 商品封面 | 5 MB | 自动压缩 |
| 资源池图片 | 500 MB | 自动压缩 |

### 7.2 上传频率限制

- 所有上传接口共用**按用户**的频率限流（默认 60 秒 20 次）
- 超限返回 429

### 7.3 你的责任

- 上传前确认你有权分享该内容
- 你上传的内容，你将授予本服务"为提供服务目的存储、传输、展示"的许可
- 你上传违法内容导致的全部后果，由你本人承担

## 八、API 密钥

### 8.1 用途

API 密钥是**独立于浏览器登录**的第二认证通道，用于：

- 脚本调用（curl、自动化工具）
- 第三方应用接入

### 8.2 安全责任

- **明文密钥只显示一次**，服务端只存哈希
- **妥善保存**：不要提交到公开代码仓库、不要在聊天里发送、不要截图分享
- **IP 绑定**：密钥绑定申请时的来源 IP，从其他 IP 使用会被拒
- **即时失效**：账号被封禁 / 禁用 → 密钥立即失效

### 8.3 禁止事项

- 不得转让、出售密钥
- 不得用密钥从事自动化攻击、爬虫、刷接口
- 不得绕过限流、滥用 API

### 8.4 泄漏处理

- 怀疑泄漏 → **立即撤销** → 重新申请
- 撤销密钥**不会释放 IP 绑定**（这是有意设计）；如需释放，联系管理员

## 九、插件

### 9.1 插件是什么

插件是运行在**沙箱 iframe** 里的第三方代码，通过**消息桥**与宿主通信。它可以：

- 读你的昵称、头像、好友、会话列表
- 以你的身份发消息
- 读写自己的 KV 存储
- 发起积分支付请求

### 9.2 安装前必须做的事

- **仔细阅读权限列表** —— 插件能做什么，取决于它申请什么权限
- **只安装你信任的插件**
- 从分享码安装时，确认分享者身份

### 9.3 开发者须知

- 不得申请与功能无关的权限
- 不得在插件里隐藏后门、采集用户数据
- 不得利用插件绕过宿主的付费、限流等机制
- 插件的行为由开发者负责；恶意插件会被**永久封禁开发者账号**

### 9.4 支付

- 插件支付**必须在宿主侧确认**（插件无法绕过）
- 支付后 7 天内可自助退款
- 超过 7 天退款需联系管理员
- 插件作者**余额不足时无法退款**（需先补足）

## 十、隐私

### 10.1 我们收集什么

- **账号信息**：用户名、昵称、头像、密码哈希
- **行为信息**：消息、订单、转账记录、登录日志
- **技术信息**：IP 地址、User-Agent（用于安全审计）

### 10.2 我们怎么用

- 提供核心服务（聊天、商城、支付等）
- 安全防护（限流、封禁、审计）
- 数据统计（匿名化后）

### 10.3 我们不会

- 向第三方出售、出租、交易你的个人信息
- 未经你同意公开你的隐私信息

### 10.4 你的权利

- **查看**：你的消息、订单、积分流水随时可在界面查看
- **更正**：昵称、头像可随时修改
- **删除**：联系管理员删除账号（不可恢复）
- **导出**：联系管理员导出个人数据

## 十一、违规处理

### 11.1 处理方式

根据情节轻重，采取以下一项或多项措施：

| 措施 | 说明 |
| --- | --- |
| 警告 | 通过站内通知或私聊提醒 |
| 删除内容 | 删除违规消息 / 商品 / 文件 |
| 下架商品 | 商品状态改为 `delisted` 或 `hidden` |
| 禁用账号 | 暂时无法登录（`disabled`） |
| 查封账号 | 永久无法登录（`banned`），名下密钥全部失效 |
| 撤销角色 | 回收管理员 / 开发者权限 |
| 清空积分 | 没收通过违规获得的积分 |
| 法律途径 | 涉及违法犯罪的，移交相关部门 |

### 11.2 处理原则

- **先轻后重**：初犯以警告为主，累犯从严
- **证据优先**：所有处理留有审计日志
- **一事一议**：同一行为不重复处罚

## 十二、举报与申诉

### 12.1 如何举报

- 遇到违规内容 → 通过聊天记录截图 + 说明发给管理员
- 遇到诈骗 / 骚扰 → 立即删除好友 + 举报 + 修改密码
- 遇到商品抄袭 → 通过管理面板举报

### 12.2 举报要求

- 提供**具体证据**（截图、时间、对方 ID）
- **不得恶意举报**（滥举报同样会被处理）
- 举报后耐心等待，处理有先后

### 12.3 如何申诉

- 认为处理有误 → 通过管理员联系，说明理由并提供证据
- 申诉期间**不停止处罚**
- 申诉成功后，我们会恢复你的内容 / 账号 / 积分

## 十三、免责声明

### 13.1 服务可用性

- 我们尽力保证服务持续可用，但**不承诺 100% 无中断**
- 因维护、升级、不可抗力导致的服务中断，我们不承担赔偿责任

### 13.2 用户内容

- 用户发布的内容由**用户本人**负责
- 我们不对用户之间的纠纷承担责任
- 如发现违法内容，我们会配合执法部门调查

### 13.3 第三方服务

- 本服务不接入第三方登录、第三方支付、第三方内容分发
- 用户自行通过 API 密钥接入的第三方应用，风险由用户承担

## 十四、附则

### 14.1 解释权

本守则的最终解释权归本服务运营方所有。

### 14.2 与其他规则的关系

- 本守则与站内其他专项规则（如群规、插件市场规则）不一致的，以**专项规则为准**
- 本守则与法律法规不一致的，以**法律法规为准**

### 14.3 联系方式

- **一般问题** → 站内私聊管理员
- **安全事件** → 私聊开发者
- **紧急情况** → 通过其他渠道联系运营方

### 14.4 生效

本守则自 2026-10-02 起生效。

  <script>
(function () {
  'use strict';

  var srcEl = document.getElementById('rules-src');
  if (!srcEl) {
    document.getElementById('content').textContent = '守则内容缺失';
    return;
  }
  var src = srcEl.textContent;
  src = src.replace(/^\s*\n/, '').replace(/\s+$/, '\n');

  var contentEl = document.getElementById('content');
  var tocEl = document.getElementById('toc');

  // ---------- 转义 ----------
  function esc(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  // ---------- 行内标记 ----------
  function inline(s) {
    var out = esc(s);

    var codes = [];
    out = out.replace(/`([^`]+)`/g, function (_, code) {
      codes.push(code);
      return '\u0000C' + (codes.length - 1) + '\u0000';
    });

    out = out.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, function (_, text, url) {
      if (!/^(https?:|#|\/)/i.test(url)) url = '#';
      return '<a href="' + url.replace(/"/g, '%22') +
        '" target="_blank" rel="noreferrer noopener">' + text + '</a>';
    });

    out = out.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    out = out.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, '$1<em>$2</em>');

    out = out.replace(/\u0000C(\d+)\u0000/g, function (_, i) {
      return '<code>' + esc(codes[+i]) + '</code>';
    });

    return out;
  }

  // ---------- 块级渲染 ----------
  var tocItems = [];
  var slug = 0;

  function render(md) {
    var lines = md.replace(/\r\n?/g, '\n').split('\n');
    var html = [];
    var i = 0;
    var n = lines.length;

    while (i < n) {
      var line = lines[i];

      // 代码块 ```lang ... ```
      var fence = line.match(/^```(\w*)\s*$/);
      if (fence) {
        var lang = fence[1];
        var buf = [];
        i++;
        while (i < n && !/^```\s*$/.test(lines[i])) {
          buf.push(lines[i]);
          i++;
        }
        if (i < n) i++;
        html.push('<pre><code' + (lang ? ' class="lang-' + esc(lang) + '"' : '') +
          '>' + esc(buf.join('\n')) + '</code></pre>');
        continue;
      }

      // 水平线
      if (/^---+\s*$/.test(line) || /^\*\*\*+\s*$/.test(line)) {
        html.push('<hr>');
        i++;
        continue;
      }

      // 表格
      if (/^\|/.test(line) && i + 1 < n && /^\|[\s\-:|]+\|\s*$/.test(lines[i + 1])) {
        var head = splitRow(line);
        i += 2;
        var rows = [];
        while (i < n && /^\|/.test(lines[i])) {
          rows.push(splitRow(lines[i]));
          i++;
        }
        html.push(
          '<table><thead><tr>' +
          head.map(function (c) { return '<th>' + inline(c) + '</th>'; }).join('') +
          '</tr></thead><tbody>' +
          rows.map(function (r) {
            return '<tr>' + r.map(function (c) {
              return '<td>' + inline(c) + '</td>';
            }).join('') + '</tr>';
          }).join('') +
          '</tbody></table>'
        );
        continue;
      }

      // 标题
      var h = line.match(/^(#{1,4})\s+(.*?)\s*#*\s*$/);
      if (h) {
        var level = h[1].length;
        var id = 'sec-' + (++slug);
        html.push('<h' + level + ' id="' + id + '">' + inline(h[2]) +
          '</h' + level + '>');
        if (level <= 3) tocItems.push({ level: level, id: id, text: h[2] });
        i++;
        continue;
      }

      // 引用
      if (/^>\s?/.test(line)) {
        var q = [];
        while (i < n && /^>\s?/.test(lines[i])) {
          q.push(lines[i].replace(/^>\s?/, ''));
          i++;
        }
        html.push('<blockquote>' + render(q.join('\n')) + '</blockquote>');
        continue;
      }

      // 无序列表
      if (/^[-*+]\s+/.test(line)) {
        var ul = [];
        while (i < n && /^[-*+]\s+/.test(lines[i])) {
          ul.push(lines[i].replace(/^[-*+]\s+/, ''));
          i++;
        }
        html.push('<ul>' + ul.map(function (t) {
          return '<li>' + inline(t) + '</li>';
        }).join('') + '</ul>');
        continue;
      }

      // 有序列表
      if (/^\d+\.\s+/.test(line)) {
        var ol = [];
        while (i < n && /^\d+\.\s+/.test(lines[i])) {
          ol.push(lines[i].replace(/^\d+\.\s+/, ''));
          i++;
        }
        html.push('<ol>' + ol.map(function (t) {
          return '<li>' + inline(t) + '</li>';
        }).join('') + '</ol>');
        continue;
      }

      // 空行
      if (/^\s*$/.test(line)) { i++; continue; }

      // 段落
      var para = [];
      while (
        i < n &&
        !/^\s*$/.test(lines[i]) &&
        !/^(#{1,4})\s+/.test(lines[i]) &&
        !/^```/.test(lines[i]) &&
        !/^>\s?/.test(lines[i]) &&
        !/^[-*+]\s+/.test(lines[i]) &&
        !/^\d+\.\s+/.test(lines[i]) &&
        !/^---+\s*$/.test(lines[i]) &&
        !/^\|/.test(lines[i])
      ) {
        para.push(lines[i]);
        i++;
      }
      html.push('<p>' + inline(para.join(' ')) + '</p>');
    }

    return html.join('\n');
  }

  function splitRow(line) {
    return line.replace(/^\||\|$/g, '').split('|').map(function (s) {
      return s.trim();
    });
  }

  // ---------- 渲染 ----------
  try {
    contentEl.innerHTML = render(src);
  } catch (err) {
    contentEl.textContent = '渲染失败：' + (err && err.message ? err.message : err);
    return;
  }

  // ---------- TOC ----------
  if (tocItems.length > 0) {
    tocEl.innerHTML = tocItems.map(function (it) {
      return '<a href="#' + it.id + '" data-level="' + it.level + '">' +
        esc(it.text) + '</a>';
    }).join('');
  }

  tocEl.addEventListener('click', function (e) {
    var a = e.target.closest && e.target.closest('a');
    if (!a) return;
    e.preventDefault();
    var target = document.getElementById(a.getAttribute('href').slice(1));
    if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });

  // ---------- 顶栏交互 ----------
  var tocBtn = document.getElementById('toc-toggle');
  tocBtn.addEventListener('click', function () {
    tocEl.hidden = !tocEl.hidden;
    tocBtn.textContent = tocEl.hidden ? '目录' : '收起';
  });

  document.getElementById('print').addEventListener('click', function () {
    window.print();
  });

  // 关闭按钮：通过宿主注入的桥调用 ui.close
  document.getElementById('close').addEventListener('click', function () {
    if (window.hostAPI && typeof window.hostAPI.call === 'function') {
      window.hostAPI.call('ui.close', {}).catch(function () {});
    }
  });
})();
  </script>
</body>
</html>
